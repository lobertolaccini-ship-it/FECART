<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Terminal - Cyberpunk</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --dark-bg: #050510;
            --terminal-bg: rgba(0, 20, 40, 0.9);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--dark-bg);
            color: var(--neon-blue);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        header {
            padding: 15px;
            border-bottom: 1px solid var(--neon-blue);
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            text-shadow: 0 0 5px var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            position: relative;
            z-index: 1000;
        }

        #phase-title {
            color: var(--neon-pink);
            font-size: 1.2em;
            margin-bottom: 5px;
            text-shadow: 0 0 5px var(--neon-pink);
        }

        #desk {
            position: relative;
            height: calc(100% - 140px);
            width: 100%;
            overflow: hidden;
        }

        /* Ícones de Documentos na Mesa */
        .icon-item {
            position: absolute;
            width: 80px;
            height: 80px;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .icon-item svg {
            width: 50px;
            height: 50px;
            stroke: var(--neon-blue);
            filter: drop-shadow(0 0 5px var(--neon-blue));
            transition: all 0.2s;
        }

        .icon-item.pink-icon svg {
            stroke: var(--neon-pink);
            filter: drop-shadow(0 0 5px var(--neon-pink));
        }

        .icon-item:hover svg {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px var(--neon-blue));
        }

        .icon-item.pink-icon:hover svg {
            filter: drop-shadow(0 0 10px var(--neon-pink));
        }

        .icon-label {
            font-size: 0.7em;
            margin-top: 5px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 2px 5px;
            border: 1px solid var(--neon-blue);
            border-radius: 3px;
            pointer-events: none;
        }
        
        .icon-item.pink-icon .icon-label {
            color: var(--neon-pink);
            border-color: var(--neon-pink);
        }

        /* Modal de Leitura de Documentos */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #document-modal {
            background: #111;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            padding: 20px;
            max-width: 500px;
            width: 90%;
            position: relative;
            color: #ddd;
            font-size: 1.1em;
            line-height: 1.5;
        }

        #document-modal.pink-style {
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.4);
        }

        #document-title {
            color: var(--neon-blue);
            border-bottom: 1px dashed var(--neon-blue);
            margin-bottom: 15px;
            padding-bottom: 5px;
            font-size: 1.2em;
            text-transform: uppercase;
        }
        
        #document-modal.pink-style #document-title {
            color: var(--neon-pink);
            border-bottom-color: var(--neon-pink);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2em;
        }

        .close-btn:hover {
            color: #f00;
            text-shadow: 0 0 5px #f00;
        }

        /* Terminal Rodapé */
        #terminal {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: var(--terminal-bg);
            border-top: 1px solid var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        input[type="text"] {
            background: #000;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 10px;
            font-family: inherit;
            width: 300px;
            outline: none;
            text-align: center;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px var(--neon-blue) inset;
        }

        button {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        #result-msg {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            border-radius: 3px;
            display: none;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .success { color: #0f0; background: rgba(0,255,0,0.1); border: 1px solid #0f0; box-shadow: 0 0 10px #0f0;}
        .error { color: #f00; background: rgba(255,0,0,0.1); border: 1px solid #f00; box-shadow: 0 0 10px #f00;}

        /* Draggable logic */
        .dragging {
            opacity: 0.5;
        }
        
        .hidden-text { color: #111; text-shadow: none; transition: 0.3s; }
        .hidden-text:hover { color: #888; }
    </style>
</head>
<body>

    <header>
        <div id="phase-title">SYS.OP: INICIANDO...</div>
        <p id="mission-text">Carregando missão...</p>
    </header>

    <div id="desk">
        <!-- Ícones são gerados por JS -->
    </div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" onclick="closeModal(event)">
        <div id="document-modal" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal(null, true)">[X]</span>
            <div id="document-title">Título</div>
            <div id="document-content">Conteúdo aqui...</div>
        </div>
    </div>

    <div id="terminal">
        <div id="result-msg"></div>
        <label for="answer">INPUT:</label>
        <input type="text" id="answer" placeholder="Insira a resposta..." autocomplete="off">
        <button onclick="checkAnswer()">VERIFICAR</button>
    </div>

    <script>
        // SVGs para os ícones
        const svgs = {
            idCard: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="3"></circle><line x1="15" y1="10" x2="19" y2="10"></line><line x1="15" y1="14" x2="19" y2="14"></line><line x1="9" y1="16" x2="19" y2="16"></line></svg>',
            stickyNote: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 4h16v12l-6 6H4V4z"></path></svg>',
            paper: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>',
            envelope: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>',
            screen: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>',
            book: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>',
            tag: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>',
            receipt: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 2v20l2-2 2 2 2-2 2 2 2-2 2 2 2-2 2 2V2z"></path><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="12" y2="14"></line></svg>'
        };

        const phases = [
            {
                level: 1,
                title: "FASE 1: INICIANTE - RECONHECIMENTO",
                mission: "MISSÃO: Descubra o <strong>Nome Completo</strong> do alvo.",
                answer: "alex mercer",
                items: [
                    { id: 'i1', icon: 'idCard', style: 'top: 15%; left: 20%; transform: rotate(-5deg);', class: '', label: 'Crachá', title: 'Crachá Danificado', content: '<p>NOME: <span style="color:white;">Alex M.</span></p><p>ID: 8849-B</p>' },
                    { id: 'i2', icon: 'stickyNote', style: 'top: 50%; left: 30%; transform: rotate(10deg);', class: 'pink-icon', label: 'Post-it', title: 'Anotação', content: '<p>Lembrar: A senha do cofre é o nome da família da minha mãe + 2077.</p>' },
                    { id: 'i3', icon: 'paper', style: 'top: 30%; left: 60%; transform: rotate(2deg);', class: '', label: 'Impressão', title: 'E-mail Impresso', content: '<p><strong>De:</strong> J.D.</p><p>E aí Alex, tudo certo para amanhã? Encontrei com o velho <strong>Mercer</strong> ontem, ele mandou lembranças.</p>' }
                ]
            },
            {
                level: 2,
                title: "FASE 2: INTERMEDIÁRIO - O COFRE",
                mission: "MISSÃO: Descubra a <strong>Chave de Acesso</strong> do servidor (Formato: 5 caracteres contínuos).",
                answer: "o42nx",
                items: [
                    { id: 'i4', icon: 'stickyNote', style: 'top: 20%; left: 25%; transform: rotate(-3deg);', class: 'pink-icon', label: 'Nota Rápida', title: 'Anotação Rápida', content: '<p>Regra da Chave:<br>1. Primeira letra do nosso setor.<br>2. Número do nosso prédio.<br>3. Sigla de 2 letras do projeto.</p>' },
                    { id: 'i5', icon: 'envelope', style: 'top: 60%; left: 35%; transform: rotate(8deg);', class: '', label: 'Envelope', title: 'Carta de Boas-Vindas', content: '<p>Bem-vindo ao Setor <strong>Operacional</strong>.<br>Você foi alocado no Prédio <strong>42</strong>. Não se atrase.</p>' },
                    { id: 'i6', icon: 'screen', style: 'top: 35%; left: 65%; transform: rotate(-5deg);', class: '', label: 'Log', title: 'Log do Sistema', content: '<p>13:00 - Inicializando subsistemas.<br>13:05 - Projeto <strong>Nexus (NX)</strong> ativado com sucesso.</p>' }
                ]
            },
            {
                level: 3,
                title: "FASE 3: DIFÍCIL - DESCRIPTOGRAFIA",
                mission: "MISSÃO: Encontre o <strong>Código de Desativação</strong> da bomba lógica.",
                answer: "omega",
                items: [
                    { id: 'i7', icon: 'book', style: 'top: 25%; left: 20%; transform: rotate(0deg);', class: '', label: 'Manual', title: 'Manual de Segurança', content: '<p>Em caso de contenção de falhas, procure pela palavra-passe codificada em <strong>Base64</strong> na etiqueta de manutenção do núcleo.</p>' },
                    { id: 'i8', icon: 'tag', style: 'top: 55%; left: 45%; transform: rotate(15deg);', class: 'pink-icon', label: 'Etiqueta', title: 'Etiqueta de Manutenção', content: '<p>CORE_STATUS: ONLINE</p><p>TAG_AUTH: <span style="font-family: monospace; color: white;">VDBMRVJFRT0=</span> [CORROMPIDA]</p><p>TAG_BACKUP: <span style="font-family: monospace; color: white;">T01FR0E=</span></p>' },
                    { id: 'i9', icon: 'receipt', style: 'top: 20%; left: 70%; transform: rotate(-5deg);', class: '', label: 'Recibo', title: 'Recibo Rasgado', content: '<p class="hidden-text">Dica offline: T01FR0E decodificado revela a última letra grega.</p>' }
                ]
            },
            {
                level: 4,
                title: "SISTEMA COMPROMETIDO",
                mission: "VOCÊ VENCEU. Todas as travas de segurança foram removidas.",
                answer: "",
                items: []
            }
        ];

        let currentPhaseIndex = 0;
        let highestZ = 10;

        function renderPhase(index) {
            const desk = document.getElementById('desk');
            const phaseTitle = document.getElementById('phase-title');
            const missionText = document.getElementById('mission-text');
            const input = document.getElementById('answer');
            const btn = document.querySelector('button');

            if (index >= phases.length) return;
            const phase = phases[index];

            phaseTitle.textContent = phase.title;
            missionText.innerHTML = phase.mission;
            
            desk.innerHTML = ''; // Clear desk
            
            if (index === phases.length - 1) {
                // Fim de jogo
                desk.innerHTML = '<div style="position: absolute; top: 30%; left: 50%; transform: translateX(-50%); text-align: center; border: 2px solid #0f0; padding: 30px; box-shadow: 0 0 30px #0f0; background: #000;"><h2 style="color: #0f0; margin:0;">ACESSO ROOT GARANTIDO</h2><p style="color: #0f0;">O sistema agora é seu.</p></div>';
                input.disabled = true;
                btn.disabled = true;
                document.getElementById('terminal').style.opacity = '0.5';
                return;
            }

            // Gerar ícones
            phase.items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'icon-item ' + item.class;
                el.style.cssText = item.style;
                el.innerHTML = svgs[item.icon] + '<div class="icon-label">' + item.label + '</div>';
                
                // Add click listener for modal
                el.addEventListener('mousedown', function(e) {
                    if (e.button === 0 && !this.classList.contains('dragging')) {
                        // We differentiate click from drag inside the mouseup logic, 
                        // but to make it simple, let's use onclick and prevent trigger if dragged
                    }
                });

                desk.appendChild(el);

                // Setup Drag
                let isDragging = false;
                let isMoving = false;
                let startX, startY, initialX, initialY;

                highestZ++;
                el.style.zIndex = highestZ;

                el.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    isMoving = false;
                    highestZ++;
                    el.style.zIndex = highestZ;
                    
                    startX = e.clientX;
                    startY = e.clientY;
                    
                    const style = window.getComputedStyle(el);
                    initialX = parseInt(style.left, 10) || 0;
                    initialY = parseInt(style.top, 10) || 0;

                    document.addEventListener('mousemove', drag);
                    document.addEventListener('mouseup', dragEnd);
                });

                function drag(e) {
                    if (!isDragging) return;
                    
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    
                    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                        isMoving = true;
                        el.classList.add('dragging');
                    }

                    if (isMoving) {
                        el.style.left = initialX + dx + 'px';
                        el.style.top = initialY + dy + 'px';
                    }
                }

                function dragEnd(e) {
                    isDragging = false;
                    el.classList.remove('dragging');
                    document.removeEventListener('mousemove', drag);
                    document.removeEventListener('mouseup', dragEnd);

                    if (!isMoving) {
                        // Click event triggered
                        openModal(item.title, item.content, item.class.includes('pink-icon'));
                    }
                }
            });

            input.value = '';
        }

        // Modal Logic
        const modalOverlay = document.getElementById('modal-overlay');
        const modalBox = document.getElementById('document-modal');
        const modalTitle = document.getElementById('document-title');
        const modalContent = document.getElementById('document-content');

        function openModal(title, content, isPink) {
            modalTitle.textContent = title;
            modalContent.innerHTML = content;
            if (isPink) {
                modalBox.classList.add('pink-style');
            } else {
                modalBox.classList.remove('pink-style');
            }
            modalOverlay.style.display = 'flex';
        }

        function closeModal(e, force = false) {
            if (force || e.target === modalOverlay) {
                modalOverlay.style.display = 'none';
            }
        }

        function checkAnswer() {
            const input = document.getElementById('answer').value.trim().toLowerCase();
            const msg = document.getElementById('result-msg');
            const expectedAnswer = phases[currentPhaseIndex].answer;
            
            if (input === expectedAnswer) {
                msg.textContent = "ACESSO CONCEDIDO: AVANÇANDO NÍVEL...";
                msg.className = "success";
                msg.style.display = "block";
                
                setTimeout(() => {
                    msg.style.display = 'none';
                    currentPhaseIndex++;
                    renderPhase(currentPhaseIndex);
                }, 2500);

            } else {
                msg.textContent = "ACESSO NEGADO: DADOS INCORRETOS.";
                msg.className = "error";
                msg.style.display = "block";
                setTimeout(() => msg.style.display = 'none', 3000);
            }
        }
        
        document.getElementById('answer').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkAnswer();
        });

        // Init
        renderPhase(currentPhaseIndex);
    </script>
</body>
</html>
